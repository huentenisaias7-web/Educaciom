<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo 4: División - El Enfrentamiento Final</title>
    <link rel="stylesheet" href="css/mundo_dividir.css">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>

    <!-- Audio del Clímax -->
    <audio id="musicaFondo" src="sonidos/mario-bowser-castle.mp3" loop></audio>
    <audio id="sonidoMoneda" src="sonidos/mario-coin.mp3"></audio>
    <audio id="sonidoError" src="sonidos/mario-bump.mp3"></audio>
    <audio id="sonidoSalto" src="sonidos/mario-jump.mp3"></audio>
    <audio id="sonidoBowserCaida" src="sonidos/bowser-fall.mp3"></audio>

    <div class="contenedor-juego" id="panelJuego">
        <!-- HUD Superior -->
        <div class="hud-superior">
            <div class="hud-item">
                <span class="hud-etiqueta">MUNDO FINAL</span>
                <span class="hud-valor" id="txtFase">4-1</span>
            </div>
            <div class="hud-item">
                <span class="hud-etiqueta">MONEDAS</span>
                <span class="hud-valor">🪙 x <span id="contadorMonedas">0</span></span>
            </div>
        </div>

        <!-- Escenario de Combate -->
        <div class="escenario" id="escenarioVisual">
            <div class="barra-vida-jefe" id="contenedorVidaJefe" style="display:none;">
                <span class="nombre-jefe">BOWSER</span>
                <div class="barra-roja"><div class="vida-llenado" id="vidaJefe">100%</div></div>
            </div>
            
            <div class="elementos-graficos">
                <div class="wrapper-personaje">
                    <img id="avatarImg" class="avatar-mini" alt="Jugador">
                </div>
                <!-- El rival cambia de Toad/Cofre a Bowser Gigante -->
                <div id="objetivoGrafico" class="enemigo-final">🍄</div>
            </div>
        </div>

        <!-- Pantalla de Operación -->
        <div class="caja-pregunta">
            <p class="instruccion-pantalla" id="textoInstruccion">¡Resuelve el misterio!</p>
            <div class="operacion-wrapper">
                <span id="numDividendo">0</span> 
                <span class="signo-division">÷</span> 
                <span id="numDivisor">0</span> 
                <span class="signo-igual">=</span>
                <span class="incognita">?</span>
            </div>
        </div>

        <!-- JUEGO 1: INTERFAZ DE COFRES DE TOAD -->
        <div class="contenedor-opciones" id="interfazCofres">
            <p class="txt-pista">¡Haz clic en el cofre con el resultado correcto!</p>
            <div class="zona-cofres">
                <div class="cofre-misterioso" onclick="seleccionarOpcion(0)">
                    <div class="tapa-cofre">🧰</div>
                    <div class="numero-cofre" id="btnCofre0">0</div>
                </div>
                <div class="cofre-misterioso" onclick="seleccionarOpcion(1)">
                    <div class="tapa-cofre">🧰</div>
                    <div class="numero-cofre" id="btnCofre1">0</div>
                </div>
                <div class="cofre-misterioso" onclick="seleccionarOpcion(2)">
                    <div class="tapa-cofre">🧰</div>
                    <div class="numero-cofre" id="btnCofre2">0</div>
                </div>
            </div>
        </div>

        <!-- JUEGO 2: INTERFAZ DE BLOQUES DE LADRILLO DE BOWSER -->
        <div class="contenedor-opciones" id="interfazBloques" style="display: none;">
            <p class="txt-pista">¡Salta y rompe el bloque correcto para atacar!</p>
            <div class="zona-bloques">
                <div class="bloque-ladrillo" onclick="seleccionarOpcion(0)">
                    <div class="numero-bloque" id="btnBloque0">0</div>
                </div>
                <div class="bloque-ladrillo" onclick="seleccionarOpcion(1)">
                    <div class="numero-bloque" id="btnBloque1">0</div>
                </div>
                <div class="bloque-ladrillo" onclick="seleccionarOpcion(2)">
                    <div class="numero-bloque" id="btnBloque2">0</div>
                </div>
                <div class="bloque-ladrillo" onclick="seleccionarOpcion(3)">
                    <div class="numero-bloque" id="btnBloque3">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/mundo_dividir.js"></script>
</body>
</html>
