<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo 3: Multiplicar - Mario Style</title>
    <link rel="stylesheet" href="css/mundo_multiplicar.css">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>

    <audio id="musicaFondo" src="sonidos/mario-athletic.mp3" loop></audio>
    <audio id="sonidoMoneda" src="sonidos/mario-coin.mp3"></audio>
    <audio id="sonidoError" src="sonidos/mario-bump.mp3"></audio>
    <audio id="sonidoTubo" src="sonidos/mario-tubo.mp3"></audio>
    <audio id="sonidoVictoria" src="sonidos/mario-stage-clear.mp3"></audio>

    <div class="contenedor-juego" id="panelJuego">
        <div class="hud-superior">
            <div class="hud-item">
                <span class="hud-etiqueta">MUNDO</span>
                <span class="hud-valor" id="txtFase">3-1</span>
            </div>
            <div class="hud-item">
                <span class="hud-etiqueta">MONEDAS</span>
                <span class="hud-valor">🪙 x <span id="contadorMonedas">0</span></span>
            </div>
        </div>

        <div class="escenario" id="escenarioVisual">
            <div class="barra-progreso"><div class="progreso-llenado" id="barraProgreso"></div></div>
            
            <div class="elementos-graficos">
                <div class="wrapper-personaje">
                    <img id="avatarImg" class="avatar-mini" alt="Jugador">
                </div>
                <div id="objetivoGrafico" class="jefe-fase">🦖</div>
            </div>
        </div>

        <div class="caja-pregunta">
            <p class="instruccion-pantalla" id="textoInstruccion">¡Arrastra la respuesta correcta!</p>
            
            <div class="operacion-wrapper">
                <span id="numFactor1">0</span> 
                <span class="signo-multi">×</span> 
                <span id="numFactor2">0</span> 
                <span class="signo-igual">=</span>
                <div id="zonaDestinoArrastre" class="zona-drop" ondragover="permitirCaida(event)" ondrop="soltarElemento(event)">?</div>
            </div>
        </div>

        <div class="contenedor-drag" id="interfazDrag">
            <p class="txt-pista">Mueve el bloque numérico hacia el signo de pregunta:</p>
            <div class="zona-bloques-drag">
                <div class="bloque-dragable" id="drag0" draggable="true" ondragstart="iniciarArrastre(event)">0</div>
                <div class="bloque-dragable" id="drag1" draggable="true" ondragstart="iniciarArrastre(event)">0</div>
                <div class="bloque-dragable" id="drag2" draggable="true" ondragstart="iniciarArrastre(event)">0</div>
            </div>
        </div>

        <div class="contenedor-respuesta" id="interfazEscrita" style="display: none;">
            <input type="number" id="inputRespuesta" placeholder="???" readonly>
            <div class="teclado-numerico">
                <button onclick="presionarTecla(1)">1</button>
                <button onclick="presionarTecla(2)">2</button>
                <button onclick="presionarTecla(3)">3</button>
                <button onclick="presionarTecla(4)">4</button>
                <button onclick="presionarTecla(5)">5</button>
                <button onclick="presionarTecla(6)">6</button>
                <button onclick="presionarTecla(7)">7</button>
                <button onclick="presionarTecla(8)">8</button>
                <button onclick="presionarTecla(9)">9</button>
                <button onclick="borrarTecla()" class="btn-borrar">❌</button>
                <button onclick="presionarTecla(0)">0</button>
                <button onclick="enviarRespuesta()" class="btn-enviar">OK</button>
            </div>
        </div>
    </div>

    <div class="contenedor-resultados" id="panelResultados" style="display: none;">
        <h1 class="titulo-resultados">¡WORLD 3 CLEAR!</h1>
        
        <div class="tarjeta-usuario">
            <img id="avatarResultados" class="avatar-final" alt="Avatar">
            <h2 id="nombreResultados">Jugador</h2>
        </div>

        <div class="tabla-estadisticas">
            <div class="fila-est">
                <span>CORRECTAS:</span>
                <span class="txt-verde" id="resCorrectas">0</span>
            </div>
            <div class="fila-est">
                <span>INCORRECTAS:</span>
                <span class="txt-rojo" id="resIncorrectas">0</span>
            </div>
            <div class="fila-est total-monedas">
                <span>TOTAL MONEDAS:</span>
                <span>🪙 <span id="resMonedas">0</span></span>
            </div>
        </div>

        <p class="mensaje-felicitacion">¡Dominas las tablas a la perfección!</p>

        <div id="tuboSalida" class="tubo" onclick="volverAlMenu()">
            <div class="tubo-boca">VOLVER</div>
            <div class="tubo-cuerpo"></div>
        </div>
    </div>

    <script src="js/mundo_multiplicar.js"></script>
</body>
</html>
